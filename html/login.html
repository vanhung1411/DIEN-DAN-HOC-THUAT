<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>EduHub - Đăng nhập &amp; Đăng ký Tài khoản</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <style>
    @layer base { html, body { margin: 0; padding: 0; } body { overscroll-behavior: none; } }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      "darkMode": "class",
      "theme": {
        "extend": {
          "colors": {
            "primary": "#3525cd", "surface-container": "#eaedff", "outline": "#777587", "primary-container": "#4f46e5",
            "surface-container-low": "#f2f3ff", "surface-container-lowest": "#ffffff", "background": "#faf8ff", "surface": "#faf8ff"
          },
          "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
          "fontFamily": { "body-md": ["Be Vietnam Pro"], "headline-md": ["Be Vietnam Pro"], "title-lg": ["Be Vietnam Pro"] }
        }
      }
    }
  </script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-surface-container-lowest p-8 rounded-3xl shadow-xl space-y-6 border border-surface-container-low">
    
    <!-- BRAND HEADER -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-2xl bg-primary-container text-on-primary flex items-center justify-center mx-auto shadow-md">
        <span class="material-symbols-outlined text-4xl">school</span>
      </div>
      <h1 class="font-headline-md text-2xl text-on-surface font-bold">EduHub Academic</h1>
      <p class="font-body-md text-on-surface-variant text-sm">Nền tảng Thảo luận &amp; Chia sẻ Tài nguyên Học thuật Số</p>
    </div>

    <!-- 2 UI TABS: LOGIN & REGISTER -->
    <div class="flex items-center p-1.5 rounded-2xl bg-surface-container-low border border-surface-container">
      <button id="tabBtnLogin" type="button" class="flex-1 py-2.5 rounded-xl font-title-md font-bold text-sm text-center transition-all bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-2 cursor-pointer">
        <span class="material-symbols-outlined text-[18px]">login</span>
        <span>Đăng nhập</span>
      </button>
      <button id="tabBtnRegister" type="button" class="flex-1 py-2.5 rounded-xl font-title-md font-bold text-sm text-center transition-all text-outline hover:text-on-surface flex items-center justify-center gap-2 cursor-pointer">
        <span class="material-symbols-outlined text-[18px]">person_add</span>
        <span>Đăng ký</span>
      </button>
    </div>

    <!-- 1. FORM ĐĂNG NHẬP (LOGIN UI) -->
    <form id="formLogin" class="space-y-4">
      <div class="space-y-1.5">
        <label class="font-label-lg text-on-surface font-semibold text-xs flex items-center gap-1">
          <span class="material-symbols-outlined text-[16px] text-primary">person</span>
          <span>Tên đăng nhập hoặc Email sinh viên</span>
        </label>
        <input id="loginUsername" type="text" required placeholder="student_an hoặc quocan.le@hcmut.edu.vn" class="w-full h-11 px-3.5 bg-surface-container-low rounded-xl text-on-surface font-body-md text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"/>
      </div>

      <div class="space-y-1.5">
        <label class="font-label-lg text-on-surface font-semibold text-xs flex items-center gap-1">
          <span class="material-symbols-outlined text-[16px] text-primary">key</span>
          <span>Mật khẩu</span>
        </label>
        <div class="relative flex items-center">
          <input id="loginPassword" type="password" required placeholder="••••••••" class="w-full h-11 pl-3.5 pr-10 bg-surface-container-low rounded-xl text-on-surface font-body-md text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"/>
          <button type="button" class="btn-toggle-pw absolute right-3 text-outline hover:text-on-surface" data-target="loginPassword">
            <span class="material-symbols-outlined text-[18px]">visibility</span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-1.5 cursor-pointer">
          <input type="checkbox" checked class="rounded text-primary focus:ring-primary"/>
          <span class="text-on-surface-variant">Ghi nhớ phiên làm việc</span>
        </label>
        <a href="#" onclick="alert('Vui lòng liên hệ Ban Quản trị EduHub để khôi phục mật khẩu.');" class="text-primary font-semibold hover:underline">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="w-full h-12 bg-primary text-on-primary font-label-lg font-bold rounded-xl shadow-md hover:bg-primary-container transition-all cursor-pointer flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[20px]">login</span>
        <span>Đăng nhập hệ thống</span>
      </button>

      <!-- DEMO ACCOUNTS QUICK SWITCHER -->
      <div class="p-4 bg-surface-container-low rounded-2xl space-y-2.5 text-xs border border-surface-container">
        <div class="font-bold text-primary flex items-center justify-between">
          <span>⚡ Tài khoản trải nghiệm nhanh:</span>
          <span class="text-[11px] text-outline font-normal">Chỉ cần bấm "Vào ngay"</span>
        </div>
        <div class="flex justify-between items-center bg-surface-container-lowest p-2.5 rounded-xl border border-surface-container-high">
          <div>
            <strong class="text-on-surface block text-xs">🧑‍🎓 Sinh viên (Student)</strong>
            <span class="text-outline font-mono text-[11px]">student_an / 123</span>
          </div>
          <button type="button" onclick="quickLogin('student_an', '123', 'index.html')" class="px-3 py-1.5 bg-primary text-on-primary font-bold rounded-lg hover:bg-primary-container shadow-sm cursor-pointer transition-all">
            Vào ngay
          </button>
        </div>
        <div class="flex justify-between items-center bg-surface-container-lowest p-2.5 rounded-xl border border-surface-container-high">
          <div>
            <strong class="text-on-surface block text-xs text-tertiary">👮 Kiểm duyệt viên (Admin / Mod)</strong>
            <span class="text-outline font-mono text-[11px]">mod_teacher / 123</span>
          </div>
          <button type="button" onclick="quickLogin('mod_teacher', '123', 'moderation.html')" class="px-3 py-1.5 bg-tertiary-container text-on-tertiary font-bold rounded-lg hover:bg-tertiary shadow-sm cursor-pointer transition-all">
            Vào ngay
          </button>
        </div>
      </div>
    </form>

    <!-- 2. FORM ĐĂNG KÝ (REGISTER UI) -->
    <form id="formRegister" class="space-y-3.5 hidden">
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="font-label-lg text-on-surface font-semibold text-xs">Tên đăng nhập *</label>
          <input id="regUsername" type="text" required placeholder="linhtran_dev" class="w-full h-10 px-3 bg-surface-container-low rounded-xl text-on-surface text-xs focus:outline-none focus:ring-2 focus:ring-primary/20"/>
        </div>
        <div class="space-y-1">
          <label class="font-label-lg text-on-surface font-semibold text-xs">Họ và tên *</label>
          <input id="regFullName" type="text" required placeholder="Trần Phương Linh" class="w-full h-10 px-3 bg-surface-container-low rounded-xl text-on-surface text-xs focus:outline-none focus:ring-2 focus:ring-primary/20"/>
        </div>
      </div>

      <div class="space-y-1">
        <label class="font-label-lg text-on-surface font-semibold text-xs">Email sinh viên *</label>
        <input id="regEmail" type="email" required placeholder="phuonglinh@student.edu.vn" class="w-full h-10 px-3 bg-surface-container-low rounded-xl text-on-surface text-xs focus:outline-none focus:ring-2 focus:ring-primary/20"/>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="font-label-lg text-on-surface font-semibold text-xs">Mật khẩu *</label>
          <input id="regPassword" type="password" required placeholder="••••••••" class="w-full h-10 px-3 bg-surface-container-low rounded-xl text-on-surface text-xs focus:outline-none focus:ring-2 focus:ring-primary/20"/>
        </div>
        <div class="space-y-1">
          <label class="font-label-lg text-on-surface font-semibold text-xs">Nhập lại mật khẩu *</label>
          <input id="regPasswordConfirm" type="password" required placeholder="••••••••" class="w-full h-10 px-3 bg-surface-container-low rounded-xl text-on-surface text-xs focus:outline-none focus:ring-2 focus:ring-primary/20"/>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="font-label-lg text-on-surface font-semibold text-xs">Khoa / Chuyên ngành</label>
          <select id="regDepartment" class="w-full h-10 px-2 bg-surface-container-low rounded-xl text-on-surface text-xs focus:outline-none cursor-pointer">
            <option value="Công nghệ Thông tin">Công nghệ Thông tin</option>
            <option value="Toán cao cấp">Toán cao cấp</option>
            <option value="Kinh tế lượng">Kinh tế lượng</option>
            <option value="Ngoại ngữ IELTS">Ngoại ngữ IELTS</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="font-label-lg text-on-surface font-semibold text-xs">Trường Đại học</label>
          <input id="regSchool" type="text" placeholder="ĐH Bách Khoa Hà Nội" class="w-full h-10 px-3 bg-surface-container-low rounded-xl text-on-surface text-xs focus:outline-none"/>
        </div>
      </div>

      <button type="submit" class="w-full h-11 bg-primary text-on-primary font-label-lg font-bold rounded-xl shadow-md hover:bg-primary-container transition-all cursor-pointer flex items-center justify-center gap-2 mt-2">
        <span class="material-symbols-outlined text-[18px]">how_to_reg</span>
        <span>Tạo tài khoản sinh viên</span>
      </button>
    </form>

  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/posts.js"></script>
  <script src="assets/js/documents.js"></script>
  <script src="assets/js/friends.js"></script>
  <script src="assets/js/moderation.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabBtnLogin = document.getElementById('tabBtnLogin');
      const tabBtnRegister = document.getElementById('tabBtnRegister');
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');

      // Check URL query parameter mode
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('mode') === 'register') {
        switchTab('register');
      }

      tabBtnLogin.addEventListener('click', () => switchTab('login'));
      tabBtnRegister.addEventListener('click', () => switchTab('register'));

      function switchTab(mode) {
        if (mode === 'login') {
          formLogin.classList.remove('hidden');
          formRegister.classList.add('hidden');
          tabBtnLogin.className = 'flex-1 py-2.5 rounded-xl font-title-md font-bold text-sm text-center transition-all bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-2 cursor-pointer';
          tabBtnRegister.className = 'flex-1 py-2.5 rounded-xl font-title-md font-bold text-sm text-center transition-all text-outline hover:text-on-surface flex items-center justify-center gap-2 cursor-pointer';
        } else {
          formLogin.classList.add('hidden');
          formRegister.classList.remove('hidden');
          tabBtnRegister.className = 'flex-1 py-2.5 rounded-xl font-title-md font-bold text-sm text-center transition-all bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-2 cursor-pointer';
          tabBtnLogin.className = 'flex-1 py-2.5 rounded-xl font-title-md font-bold text-sm text-center transition-all text-outline hover:text-on-surface flex items-center justify-center gap-2 cursor-pointer';
        }
      }

      // Handle Password show/hide toggle buttons
      document.querySelectorAll('.btn-toggle-pw').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.dataset.target;
          const input = document.getElementById(targetId);
          if (input) {
            const isPw = input.type === 'password';
            input.type = isPw ? 'text' : 'password';
            btn.querySelector('span').textContent = isPw ? 'visibility_off' : 'visibility';
          }
        });
      });

      // Submit Login Form
      formLogin.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        
        const res = Auth.login(username, password);
        if (res.success) {
          setTimeout(() => {
            if (res.user.role === 'moderator') {
              window.location.href = 'moderation.html';
            } else {
              window.location.href = 'index.html';
            }
          }, 400);
        }
      });

      // Submit Register Form
      formRegister.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('regUsername').value.trim();
        const fullName = document.getElementById('regFullName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const pw = document.getElementById('regPassword').value.trim();
        const pwConfirm = document.getElementById('regPasswordConfirm').value.trim();
        const dept = document.getElementById('regDepartment').value;
        const school = document.getElementById('regSchool').value.trim();

        if (pw !== pwConfirm) {
          Utils.showToast('Mật khẩu nhập lại không khớp!', 'warning');
          return;
        }

        const res = Auth.register({
          username: username,
          fullName: fullName,
          email: email,
          password: pw,
          department: dept,
          school: school
        });

        if (res.success) {
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);
        }
      });
    });

    function quickLogin(username, password, redirectUrl) {
      Auth.login(username, password);
      setTimeout(() => {
        window.location.href = redirectUrl;
      }, 300);
    }
  </script>
</body>
</html>
